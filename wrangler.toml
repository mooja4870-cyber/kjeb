# Cloudflare Pages + Functions + D1 설정
name = "kjeb"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# D1 데이터베이스 바인딩 — 함수 안에서 env.DB 로 접근
# database_id 는 `wrangler d1 create kjeb-db` 실행 후 출력값으로 교체
[[d1_databases]]
binding = "DB"
database_name = "kjeb-db"
database_id = "5f47deb5-cc84-4855-9534-0dc8b922d06c"
